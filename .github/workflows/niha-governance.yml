# niha Governance — runs on every PR.
# Generated by: niha ci agent init
#
# Wraps the canonical composite action shipped from
# https://github.com/niha-and-co/ai-platform/tree/main/.github/actions/niha-ci
#
# MODIFIED FROM THE GENERATED OUTPUT, twice, both deliberately:
#
#   1. The ref was `@v1`, which has never existed in that repository — it tags
#      full versions only (v1.0.0 … v1.2.8) and has no v1 branch. GitHub could
#      not resolve it, so this workflow failed at job setup on every PR before
#      running anything. Filed as niha-and-co/ai-platform#1033, fixed upstream
#      in #1034. Pinned here to v1.2.8, where the action verifiably exists.
#
#   2. The governance step is guarded on NIHA_API_KEY being present. This repo
#      has no niha credential in its secrets, and a job that fails for a missing
#      secret is indistinguishable at a glance from a job that failed a
#      governance check. It skips visibly instead.
#
# The file exactly as generated is kept at
# field/artifacts/niha-generated-workflow.yml, as the evidence for #1033.

name: niha Governance

on:
  pull_request:
    branches: [main, develop]

jobs:
  governance:
    name: Governance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required to post the PR comment
    env:
      # The secrets context cannot be used in a job-level `if`, so it is mapped
      # to env here and tested per step.
      HAS_NIHA_KEY: ${{ secrets.NIHA_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Note when governance is not configured
        if: env.HAS_NIHA_KEY != 'true'
        run: |
          echo "::notice::NIHA_API_KEY is not set — governance did not run."
          echo "This is a skip, not a pass. See field/report.md."

      - name: Install niha CLI
        if: env.HAS_NIHA_KEY == 'true'
        run: npm install -g @niha-and-co/niha

      - name: Run niha governance
        if: env.HAS_NIHA_KEY == 'true'
        uses: niha-and-co/ai-platform/.github/actions/niha-ci@v1.2.8
        with:
          api-key: ${{ secrets.NIHA_API_KEY }}
          workspace-id: ${{ vars.NIHA_WORKSPACE_ID }}
          fail-on: restricted     # blocked | restricted | advisory | never
          comment: "true"        # post a PR comment with the verdict
